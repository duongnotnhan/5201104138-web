<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm/Cập nhật Sản phẩm</title>
</head>

<body>
    <fieldset>
        <legend>Thêm/Cập nhật Sản phẩm</legend>
        ID: <input id="productID" /><br />
        Name: <input id="productName" /><br />
        Price: <input id="productPrice" type="number" /><br />
        <button type="button" onclick="capNhatSanPham()">Thêm/Cập nhật</button>
    </fieldset>
    <div id="result">

    </div>
    <script>
        const getListSP = () => JSON.parse(localStorage.getItem("products")) || [];
        const displaySPs = () => {
            let string = "";
            getListSP().forEach(item => {
                string += `<div>${item.id} - ${item.name} - ${item.price}
                            <button type="button" onclick="editSP(${item.id})">Sửa</button>
                            <button type="button" onclick="removeSP(${item.id})">Xóa</button>
                           </div>`;
                document.getElementById('result').innerHTML = string;
            });
        }
        const updateListSP = (data) => {
            localStorage.setItem('products', JSON.stringify(data));
            displaySPs();
        }
        function editSP(id) {
            let listSP = getListSP();
            let product = listSP.find(p => p.id == id);
            document.getElementById("productID").value = product.id;
            document.getElementById("productName").value = product.name;
            document.getElementById("productPrice").value = product.price;
        }
        function removeSP(id) {
            let listSP = getListSP();
            listSP = listSP.filter(p => p.id != id);
            updateListSP(listSP);
        }
        function capNhatSanPham() {
            let productID = document.getElementById("productID").value;
            let productName = document.getElementById("productName").value;
            let productPrice = document.getElementById("productPrice").value;

            if (productPrice < 0) {alert("Giá bán phải lớn hơn hoặc bằng 0."); return;}
            
            let listSP = getListSP();
            let product = listSP.find(p => p.id == productID);
            if (product == undefined) {
                listSP.push({
                    id: productID, name: productName, price: productPrice
                });
                updateListSP(listSP);
            } else {
                listSP.forEach(item => {
                    if (item.id == productID) {
                        item.name = productName;
                        item.price = productPrice;
                    }
                });
                updateListSP(listSP);
            }
        }
        displaySPs();
    </script>
</body>
</html>
